[package]
name = "yalidb-server"
description = "Loopback HTTP adapter for YaliDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
yalidb-core = { path = "../yalidb-core" }
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "signal", "io-util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
